<div class="unauthorized-container">

  <div class="unauthorized-card">

    <!-- Header -->
    <div class="card-header">

      <span class="status-badge error">
        403 Forbidden
      </span>

      <span class="comp-id">
        ACCESS_DENIED
      </span>

    </div>


    <!-- Main Content -->
    <span class="eyebrow">
      AUTHORIZATION ERROR
    </span>

    <h1 class="error-title">
      Access <em>Denied</em>
    </h1>

    <p class="error-desc">
      You don't have permission to access this page.
      Your current account does not have the required permissions
      to view this resource.
    </p>


    <!-- Information Box -->
    <div class="info-box">

      <div class="info-item">
        <span class="info-label">
          Error Code
        </span>

        <span class="info-val">
          403
        </span>
      </div>

      <span class="info-separator">
        /
      </span>

      <div class="info-item">
        <span class="info-label">
          Status
        </span>

        <span class="info-val">
          Unauthorized
        </span>
      </div>

      <span class="info-separator">
        /
      </span>

      <div class="info-item">
        <span class="info-label">
          Access
        </span>

        <span class="info-val">
          Restricted
        </span>
      </div>

    </div>


    <!-- Footer Actions -->
    <div class="card-footer">

     

      <button routerLink="/home"
        type="button"
        class="btn-card btn-pri"
      >
        Go Back
      </button>

    </div>

  </div>

</div>
